[project]
name = "wsprl"
version = "0.1.0"
description = "Local research infrastructure for weight-space analysis of RL policies"
requires-python = ">=3.12"
dependencies = [
    "gymnasium==1.2.3",
    "stable-baselines3==2.7.1",
    "torch==2.9.1",
    "numpy==2.3.5",
    "pandas==2.3.3",
    "matplotlib==3.10.7",
    "pydantic==2.12.5",
    "openai==2.8.1",
]

[dependency-groups]
dev = ["pytest==9.0.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
